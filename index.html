<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Times Tables"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<title>Times Tables Voice Quiz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#app{width:100vw;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw;background:#000;color:#fff;transition:.15s}
#app.correct{background:#159b37;color:#fff}#app.wrong{background:#e53935;color:#000}
#top{position:fixed;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;font-weight:700;font-size:clamp(15px,3.5vw,24px)}
#main{font-size:clamp(58px,15vw,180px);font-weight:800;line-height:1;margin-bottom:3vh}
#heard{font-size:clamp(22px,5vw,46px);font-weight:700;min-height:1.3em}
#sub{font-size:clamp(17px,4vw,26px);margin-top:12px;min-height:1.5em}
button,input{font:inherit}button{border:0;border-radius:18px;padding:17px 30px;font-size:clamp(21px,5vw,34px);font-weight:800;cursor:pointer}
input{width:min(520px,88vw);font-size:clamp(24px,6vw,38px);padding:16px 18px;border-radius:14px;border:2px solid #fff;text-align:center;margin:18px}
#repeat{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:18px;font-size:16px;padding:10px 16px;display:none}
#status{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:18px;font-size:15px;text-align:left;max-width:65vw}
</style></head>
<body><main id="app">
<div id="top"><span id="player"></span><span id="score">Score 0/0 · Streak 0 · Best 0</span></div>
<div id="main">What's your name?</div><div id="heard"></div>
<input id="name" autocomplete="name" placeholder="Enter your name" maxlength="30">
<button id="continue">Continue</button><button id="startQuiz" style="display:none">Start Quiz</button><div id="sub">We'll remember your best streak on this device.</div>
<div id="status"></div><button id="repeat">↻ Repeat</button>
</main>
<script>
(()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,$=s=>document.querySelector(s);
const app=$("#app"),main=$("#main"),heard=$("#heard"),sub=$("#sub"),status=$("#status"),score=$("#score"),player=$("#player"),name=$("#name"),cont=$("#continue"),startQuiz=$("#startQuiz"),repeat=$("#repeat");
let rec=null,stream=null,a,b,ans,good=0,total=0,streak=0,best=0,running=false,listening=false,speaking=false,got=false,watch=0,user="";
const praise=["Well done!","Excellent!","Great job!","That's right!","Brilliant!","Nice work!","Fantastic!","You got it!"];
function key(){return "tt-best-"+user.toLowerCase().replace(/\W+/g,"-")}
function stats(){score.textContent=`Score ${good}/${total} · Streak ${streak} · Best ${best}`}
function parse(raw){let s=(raw||"").toLowerCase().replace(/[-,]/g," ").replace(/\band\b/g," "),m=s.match(/\b\d+\b/);if(m)return +m[0];const o={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19},t={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};let n=0,f=false;for(const w of s.split(/\s+/)){if(w in o){n+=o[w];f=true}else if(w in t){n+=t[w];f=true}else if(w==="hundred"){n=(n||1)*100;f=true}}return f?n:NaN}
function stop(){clearTimeout(watch);if(rec&&listening)try{rec.abort()}catch{}listening=false}
function say(text,done){stop();speaking=true;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.95;let x=false;let end=()=>{if(x)return;x=true;speaking=false;done&&done()};u.onend=end;u.onerror=end;speechSynthesis.speak(u);setTimeout(end,5000)}
function listen(ms=250){setTimeout(()=>{if(!running||speaking||listening)return;got=false;try{rec.start()}catch{status.textContent="Restarting listening…";listen(700)}},ms)}
function makeQuestion(){a=1+Math.floor(Math.random()*10);b=1+Math.floor(Math.random()*12);ans=a*b}
function next(){stop();makeQuestion();app.className="";main.textContent=`${a} × ${b} = ?`;heard.textContent="";sub.textContent="";status.textContent="Listen…";repeat.style.display="block";say(`What is ${a} times ${b}?`,()=>listen())}
function answer(text){got=true;clearTimeout(watch);let n=parse(text);heard.textContent=`You said: ${text}`;if(Number.isNaN(n)){status.textContent="I didn't catch a number — try again";listen(700);return}total++;if(n===ans){good++;streak++;if(streak>best){best=streak;localStorage.setItem(key(),best)}app.className="correct";main.textContent=`${ans} ✓`;sub.textContent=`${a} × ${b} = ${ans}`;status.textContent=`Great, ${user}! Current streak: ${streak}`;stats();say(praise[Math.floor(Math.random()*praise.length)],()=>setTimeout(next,900))}else{streak=0;app.className="wrong";main.textContent=`${a} × ${b} = ${ans}`;sub.textContent=`The correct answer is ${ans}`;status.textContent="Streak reset — next one!";stats();say(`No. The answer is: ${a} times ${b} is ${ans}.`,()=>setTimeout(next,1300))}}
async function prepareMic(){
 status.textContent="Requesting microphone access…";
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});status.textContent="Microphone ready ✓";return true}
 catch(e){status.textContent="Microphone access is required. Please allow it in Safari settings.";return false}
}
cont.onclick=async()=>{user=name.value.trim();if(!user){name.focus();return}player.textContent=user;best=+(localStorage.getItem(key())||0);stats();name.style.display="none";cont.style.display="none";main.textContent=`Hi ${user}!`;sub.textContent="First, allow microphone access.";let ok=await prepareMic();if(!ok)return;if(!SR){main.textContent="Speech recognition unavailable";sub.textContent="This browser does not provide the required speech-recognition feature.";return}sub.textContent="Microphone ready. Tap Start Quiz.";status.textContent="Microphone ready ✓";startQuiz.style.display="block"};
startQuiz.onclick=()=>{startQuiz.style.display="none";running=true;stop();makeQuestion();app.className="";main.textContent=`${a} × ${b} = ?`;heard.textContent="";sub.textContent="";status.textContent="Listen…";repeat.style.display="block";say(`Hi ${user}. What is ${a} times ${b}?`,()=>listen())};
name.addEventListener("keydown",e=>{if(e.key==="Enter")cont.click()});
if(SR){rec=new SR();rec.lang="en-GB";rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=5;rec.onstart=()=>{listening=true;status.textContent="Listening… say the answer";clearTimeout(watch);watch=setTimeout(()=>{if(listening&&!got){status.textContent="I didn't hear you — listening again…";try{rec.abort()}catch{}}},6500)};rec.onspeechstart=()=>status.textContent="I can hear you…";rec.onresult=e=>{let r=e.results[e.results.length-1],text=r[0].transcript;for(let i=0;i<r.length;i++)if(parse(r[i].transcript)===ans){text=r[i].transcript;break}answer(text)};rec.onerror=e=>{clearTimeout(watch);if(["not-allowed","service-not-allowed"].includes(e.error)){status.textContent="Speech recognition permission was blocked.";running=false}else if(e.error!=="aborted")status.textContent="I didn't hear you — listening again…"};rec.onend=()=>{listening=false;clearTimeout(watch);if(running&&!speaking&&!got)listen(500)}}
repeat.onclick=()=>{if(!running||!Number.isFinite(a)||!Number.isFinite(b)){status.textContent="Start the quiz first.";return}say(`What is ${a} times ${b}?`,()=>listen())};
window.addEventListener("beforeunload",()=>{running=false;stop();stream?.getTracks().forEach(t=>t.stop())});
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Times Tables</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Courier New",Courier,monospace}
body{min-height:100vh;min-height:100dvh}
button,input{font-family:inherit}
.screen{min-height:100vh;min-height:100dvh;width:100%;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hidden{display:none!important}
h1{font-size:clamp(38px,10vw,72px);margin:0 0 10px;letter-spacing:2px}
.subtitle{font-size:clamp(16px,4vw,22px);margin-bottom:30px}
.name-label{font-size:18px;margin-bottom:10px}
#nameInput{display:block;width:min(420px,90vw);height:58px;padding:10px 14px;background:#fff;color:#000;border:3px solid #fff;border-radius:0;font-size:24px;text-align:center;outline:none;appearance:none;-webkit-appearance:none}
#nameInput:focus{border-color:#00ff66}
button{min-width:180px;margin-top:18px;padding:14px 18px;border:0;border-radius:0;background:#fff;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
button:active{background:#ccc}
#message{min-height:24px;margin-top:18px;font-size:14px}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;font-size:clamp(13px,3.5vw,20px);font-weight:bold}
#timer{font-size:1.15em}
#question{font-size:clamp(64px,18vw,180px);font-weight:bold}
#heard{font-size:clamp(18px,5vw,32px);min-height:40px;margin-top:20px}
#feedback{font-size:clamp(17px,4vw,26px);min-height:36px;margin-top:10px}
#repeat{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));min-width:auto;margin:0;padding:9px 12px;font-size:14px}
.correct{background:#168a36!important;color:#fff!important}
.wrong{background:#e43b32!important;color:#000!important}
#endScreen{justify-content:flex-start;overflow-y:auto;padding-top:max(55px,env(safe-area-inset-top))}
#finalScore{font-size:clamp(46px,13vw,90px);font-weight:bold;margin:10px 0}
#finalDetail{margin-bottom:24px}
.boards{width:min(720px,95vw);display:grid;grid-template-columns:1fr 1fr;gap:24px}
.board{border:2px solid #fff;padding:14px;text-align:left}
.board h2{text-align:center;font-size:18px;margin:0 0 12px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #555}
@media(max-width:650px){.boards{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="setupScreen" class="screen">
  <h1>TIMES TABLES</h1>
  <div class="subtitle">60 SECOND CHALLENGE</div>
  <label class="name-label" for="nameInput">PLAYER NAME</label>
  <input id="nameInput" type="text" maxlength="20" autocomplete="name" autocapitalize="words" placeholder="Type your name">
  <button id="readyButton" type="button">READY</button>
  <button id="startButton" class="hidden" type="button">START GAME</button>
  <div id="message"></div>
</section>

<section id="gameScreen" class="screen hidden">
  <div id="hud"><span id="playerHud"></span><span id="timer">01:00</span><span id="scoreHud">0 PTS · ×0</span></div>
  <div id="question"></div><div id="heard"></div><div id="feedback"></div>
  <button id="repeat" type="button">REPEAT</button>
</section>

<section id="endScreen" class="screen hidden">
  <h1>TIME UP</h1><div id="finalScore"></div><div id="finalDetail"></div>
  <div class="boards">
    <div class="board"><h2>BEST TODAY</h2><div id="todayBoard"></div></div>
    <div class="board"><h2>ALL TIME</h2><div id="allBoard"></div></div>
  </div>
  <button id="againButton" type="button">PLAY AGAIN</button>
</section>

<script>
(function(){
"use strict";
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);
const setup=$("setupScreen"),game=$("gameScreen"),end=$("endScreen"),nameInput=$("nameInput"),
ready=$("readyButton"),start=$("startButton"),message=$("message"),playerHud=$("playerHud"),
timer=$("timer"),scoreHud=$("scoreHud"),question=$("question"),heard=$("heard"),feedback=$("feedback"),
repeat=$("repeat"),finalScore=$("finalScore"),finalDetail=$("finalDetail"),todayBoard=$("todayBoard"),
allBoard=$("allBoard"),again=$("againButton");

let recognition=null,micStream=null,player="",a=0,b=0,answer=0,score=0,attempts=0,streak=0,bestStreak=0;
let running=false,listening=false,speaking=false,gotResult=false,watchdog=null,clockTimer=null,endAt=0;
const STORE="times-tables-scores-v8";
const praise=["Well done!","Excellent!","Great job!","Correct!","Nice work!"];

function parseNumber(raw){
 let s=(raw||"").toLowerCase().replace(/[-,]/g," ").replace(/\band\b/g," ");
 let digit=s.match(/\b\d+\b/); if(digit)return Number(digit[0]);
 const ones={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
 const tens={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
 let n=0,found=false;
 for(const w of s.split(/\s+/)){if(w in ones){n+=ones[w];found=true}else if(w in tens){n+=tens[w];found=true}else if(w==="hundred"){n=(n||1)*100;found=true}}
 return found?n:NaN;
}
function stopRecognition(){clearTimeout(watchdog);if(recognition&&listening){try{recognition.abort()}catch(e){}}listening=false}
function speak(text,done){
 stopRecognition();speaking=true;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.rate=.98;let finished=false;
 const finish=()=>{if(finished)return;finished=true;speaking=false;if(running&&done)done()};
 u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,4500);
}
function beginListening(delay=150){setTimeout(()=>{if(!running||speaking||listening)return;gotResult=false;try{recognition.start()}catch(e){beginListening(500)}},delay)}
function newQuestion(){if(!running)return;stopRecognition();a=1+Math.floor(Math.random()*10);b=1+Math.floor(Math.random()*12);answer=a*b;document.body.className="";question.textContent=`${a} × ${b} = ?`;heard.textContent="";feedback.textContent="";speak(`What is ${a} times ${b}?`,()=>beginListening())}
function updateScore(){scoreHud.textContent=`${score} PTS · ×${streak}`}
function handleAnswer(text){
 if(!running)return;gotResult=true;const n=parseNumber(text);heard.textContent=`You said: ${text}`;
 if(Number.isNaN(n)){feedback.textContent="Try again";beginListening(400);return}
 attempts++;
 if(n===answer){score++;streak++;bestStreak=Math.max(bestStreak,streak);document.body.className="correct";question.textContent=`${answer} ✓`;feedback.textContent=`Streak ×${streak}`;updateScore();speak(praise[Math.floor(Math.random()*praise.length)],()=>setTimeout(newQuestion,180))}
 else{streak=0;document.body.className="wrong";question.textContent=`${a} × ${b} = ${answer}`;feedback.textContent="Streak reset";updateScore();speak(`No. ${a} times ${b} is ${answer}.`,()=>setTimeout(newQuestion,350))}
}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function loadScores(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function saveScore(){let rows=loadScores();rows.push({name:player,score,attempts,bestStreak,date:todayKey(),time:Date.now()});rows.sort((x,y)=>y.score-x.score||y.bestStreak-x.bestStreak||x.time-y.time);localStorage.setItem(STORE,JSON.stringify(rows.slice(0,200)))}
function renderBoard(el,rows){el.innerHTML="";if(!rows.length){el.textContent="No scores yet";return}rows.slice(0,5).forEach((r,i)=>{const row=document.createElement("div");row.className="row";const rank=document.createElement("span"),nm=document.createElement("span"),sc=document.createElement("span");rank.textContent=(i+1)+".";nm.textContent=r.name;sc.textContent=r.score;row.append(rank,nm,sc);el.appendChild(row)})}
function finishGame(){
 if(!running)return;running=false;clearInterval(clockTimer);stopRecognition();speechSynthesis.cancel();document.body.className="";
 game.classList.add("hidden");saveScore();const rows=loadScores();finalScore.textContent=`${score} POINT${score===1?"":"S"}`;finalDetail.textContent=`${player} · ${score}/${attempts} correct · Best streak ×${bestStreak}`;renderBoard(todayBoard,rows.filter(r=>r.date===todayKey()));renderBoard(allBoard,rows);end.classList.remove("hidden");
 const u=new SpeechSynthesisUtterance(`Time up, ${player}. Your score is ${score}.`);speechSynthesis.speak(u);
}
function updateClock(){const left=Math.max(0,endAt-Date.now()),sec=Math.ceil(left/1000);timer.textContent=`00:${String(sec).padStart(2,"0")}`;if(left<=0)finishGame()}
async function prepare(){
 player=nameInput.value.trim();if(!player){message.textContent="Please enter your name.";nameInput.focus();return}
 ready.disabled=true;message.textContent="Requesting microphone access...";
 try{
   micStream=await navigator.mediaDevices.getUserMedia({audio:true});
   if(!SpeechRecognition){message.textContent="Speech recognition is not available in this browser.";ready.disabled=false;return}
   message.textContent="Microphone ready.";
   nameInput.disabled=true;ready.classList.add("hidden");start.classList.remove("hidden");
 }catch(e){message.textContent="Microphone access was not allowed.";ready.disabled=false}
}
function startGame(){
 score=attempts=streak=bestStreak=0;running=true;setup.classList.add("hidden");end.classList.add("hidden");game.classList.remove("hidden");playerHud.textContent=player.toUpperCase();updateScore();endAt=Date.now()+60000;updateClock();clockTimer=setInterval(updateClock,200);newQuestion()
}
ready.addEventListener("click",prepare);
nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")prepare()});
start.addEventListener("click",startGame);
repeat.addEventListener("click",()=>{if(running&&a&&b)speak(`What is ${a} times ${b}?`,()=>beginListening())});
again.addEventListener("click",()=>{end.classList.add("hidden");setup.classList.remove("hidden");nameInput.disabled=false;nameInput.value=player;ready.disabled=false;ready.classList.remove("hidden");start.classList.add("hidden");message.textContent=""});
if(SpeechRecognition){
 recognition=new SpeechRecognition();recognition.lang="en-GB";recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=5;
 recognition.onstart=()=>{listening=true;message.textContent="";watchdog=setTimeout(()=>{if(listening&&!gotResult)try{recognition.abort()}catch(e){}},5200)};
 recognition.onresult=e=>{let r=e.results[e.results.length-1],text=r[0].transcript;for(let i=0;i<r.length;i++){if(parseNumber(r[i].transcript)===answer){text=r[i].transcript;break}}handleAnswer(text)};
 recognition.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){running=false;feedback.textContent="Speech permission blocked"}};
 recognition.onend=()=>{listening=false;clearTimeout(watchdog);if(running&&!speaking&&!gotResult)beginListening(300)};
}
})();
</script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body></html>
